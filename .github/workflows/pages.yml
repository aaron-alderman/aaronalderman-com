name: Publish Aaron Alderman
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ steps.package-name.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay authoring provenance from the preceding revision
        env:
          AUTHORING_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          test -n "$AUTHORING_BASE"
          test "$AUTHORING_BASE" != 0000000000000000000000000000000000000000
          mkdir -p .build/provenance/trusted
          git archive "$AUTHORING_BASE" | tar -x -C .build/provenance/trusted
          mkdir -p .build/provenance/trusted/.build/provenance/candidate
          git archive "$GITHUB_SHA" | tar -x -C .build/provenance/trusted/.build/provenance/candidate
          git -c core.quotepath=true diff --raw --no-abbrev --no-renames --no-ext-diff "$AUTHORING_BASE" "$GITHUB_SHA" > .build/provenance/trusted/.build/provenance/changes.raw
          node .build/provenance/trusted/tooling/author.mjs .build/provenance/trusted/source/authoring/requests/provenance-selftest.request
          node .build/provenance/trusted/tooling/author.mjs .build/provenance/trusted/source/authoring/requests/provenance-gate.request > .build/provenance/replay.json
      - name: Retain the provenance replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/provenance/replay.json
          if-no-files-found: warn
      - name: Install declared verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the algebra-owned publication
        run: npm run build
      - name: Observe rendered contrast, reflow and keyboard journeys
        run: node tooling/run-reading-browser-ci.mjs
      - name: Verify Questions image observations through the algebra
        run: node tooling/author.mjs source/authoring/requests/images-verify.request
      - name: Retain image assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: tooling/assurance/image-evidence.json
          if-no-files-found: warn
      - name: Retain raw browser observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-experience-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/reading-experience-ci/
          if-no-files-found: warn
      - name: Bind the final publication evidence
        run: |
          node tooling/assess-reading-contrast.mjs
          npm run build
          node tooling/assess-reading-experience.mjs --check
      - name: Check the portable publication
        run: npm run test:portable
      - name: Verify microsite presentation from declared dependencies
        run: node tooling/verify-microsite-presentation.mjs dist
      - name: Record the verified artifact name
        id: package-name
        run: echo "name=${PAGES_ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.verify.outputs.artifact_name }}
