name: Authoring provenance
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  provenance:
    name: Authoring provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay using trusted base policy
        env:
          AUTHORING_BASE: ${{ github.event.pull_request.base.sha }}
          AUTHORING_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git fetch --no-tags origin "$AUTHORING_HEAD"
          mkdir -p .build/provenance/candidate
          git archive "$AUTHORING_HEAD" | tar -x -C .build/provenance/candidate
          git -c core.quotepath=true diff --raw --no-abbrev --no-renames --no-ext-diff "$AUTHORING_BASE" "$AUTHORING_HEAD" > .build/provenance/changes.raw
          node tooling/author.mjs source/authoring/requests/provenance-selftest.request
          node tooling/author.mjs source/authoring/requests/provenance-gate.request > .build/provenance/replay.json
      - name: Retain replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/provenance/replay.json
          if-no-files-found: warn
